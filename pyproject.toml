[project]
name = "CamTrapTools"
version = "0.1.0"
description = "Open-source toolkit for camera-trap projects: from SD card to ecological answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Posavec" }]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pillow>=11.0",
    "typer>=0.15",
]

[project.scripts]
camtraptools = "camtraptools.cli:app"

[project.optional-dependencies]
detect = [
    "megadetector>=10.0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
