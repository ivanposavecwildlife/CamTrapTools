[project]
name = "CamTrapTools"
version = "0.5.0"
description = "Open-source toolkit for camera-trap projects: from SD card to ecological answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Posavec" }]
requires-python = ">=3.11"
keywords = ["camera traps", "wildlife", "ecology", "conservation", "camtrap-dp", "speciesnet", "occupancy", "gbif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "fastapi>=0.120",
    "jinja2>=3.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "typer>=0.15",
    "uvicorn>=0.38",
]

[project.urls]
Homepage = "https://github.com/ivanposavecwildlife/CamTrapTools"
Documentation = "https://github.com/ivanposavecwildlife/CamTrapTools/blob/main/docs/user-guide.md"
Changelog = "https://github.com/ivanposavecwildlife/CamTrapTools/blob/main/CHANGELOG.md"
Issues = "https://github.com/ivanposavecwildlife/CamTrapTools/issues"

[project.scripts]
camtraptools = "camtraptools.cli:app"

[project.optional-dependencies]
detect = [
    "speciesnet>=5.0.6",
]

[dependency-groups]
dev = [
    "frictionless>=5.21",
    "httpx2>=2.14",
    "pytest>=8.3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
