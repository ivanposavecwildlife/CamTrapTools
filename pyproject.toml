[project]
name = "CamTrapTools"
version = "0.4.0"
description = "Open-source toolkit for camera-trap projects: from SD card to ecological answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Posavec" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120",
    "jinja2>=3.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "typer>=0.15",
    "uvicorn>=0.38",
]

[project.scripts]
camtraptools = "camtraptools.cli:app"

[project.optional-dependencies]
detect = [
    "speciesnet>=5.0.6",
]

[dependency-groups]
dev = [
    "frictionless>=5.21",
    "httpx2>=2.14",
    "pytest>=8.3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
